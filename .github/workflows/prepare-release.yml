name: Prepare release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Exact version, for example 0.2.0. Leave empty to use the bump below.
        required: false
        type: string
      bump:
        description: Bump applied when no exact version is given.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Decide version
        id: decide
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
        run: |
          # git prints one array element per line, and [regex] joins array
          # elements with spaces, which destroys the line anchors. Force a
          # single string with real newlines.
          $subject = (git log -1 --format=%s) -join "`n"
          $message = (git log -1 --format=%B) -join "`n"
          if ($env:EVENT -eq 'push' -and $subject -match '^chore\(release\):') {
            Write-Host "Skipping the release bump commit: $subject"
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($env:EVENT -eq 'push') {
            $match = [regex]::Match($message, '(?m)^Release-As:\s*[vV]?(\d+\.\d+\.\d+)\s*$')
            if (-not $match.Success) {
              Write-Host "No Release-As footer in '$subject'; trigger this workflow manually."
              "skip=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            $version = $match.Groups[1].Value
            Write-Host "Release-As requested $version."
            "version=$version" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION.Trim() -replace '^[vV]', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version must look like 0.2.0 (got '$version')."
            }
            "version=$version" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "bump=$env:INPUT_BUMP" >> $env:GITHUB_OUTPUT

      - name: Require a release token
        if: steps.decide.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if (-not $env:RELEASE_TOKEN) {
            throw "Add a RELEASE_TOKEN secret. Tags pushed with GITHUB_TOKEN do not start the release workflow."
          }

      - name: Bump version
        if: steps.decide.outputs.skip != 'true'
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ steps.decide.outputs.version }}
          REQUESTED_BUMP: ${{ steps.decide.outputs.bump }}
        run: |
          $arguments = @("scripts/bump_version.py")
          if ($env:REQUESTED_VERSION) {
            $arguments += $env:REQUESTED_VERSION
          } else {
            $arguments += @("--bump", $env:REQUESTED_BUMP)
          }
          $target = python @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "bump_version.py failed with exit code $LASTEXITCODE."
          }
          "VERSION=$target" >> $env:GITHUB_ENV
          Write-Host "Target version: $target"

      - name: Check the tag is free
        id: tag
        if: steps.decide.outputs.skip != 'true'
        shell: pwsh
        run: |
          $existing = git ls-remote --tags origin "refs/tags/v$env:VERSION"
          if ($existing) {
            Write-Host "Tag v$env:VERSION already exists; nothing to publish."
            "exists=true" >> $env:GITHUB_OUTPUT
          }

      - name: Configure git
        if: steps.decide.outputs.skip != 'true' && steps.tag.outputs.exists != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit the version bump
        if: steps.decide.outputs.skip != 'true' && steps.tag.outputs.exists != 'true'
        shell: pwsh
        run: |
          git add Cargo.toml Cargo.lock
          $changes = git diff --cached --name-only
          if ($LASTEXITCODE -ne 0) {
            throw "git add failed."
          }
          if (-not $changes) {
            Write-Host "Cargo.toml is already at $env:VERSION."
          } else {
            git commit -m "chore(release): bump version to $env:VERSION"
            if ($LASTEXITCODE -ne 0) {
              throw "git commit failed."
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              throw "git push failed."
            }
          }

      - name: Tag and push
        if: steps.decide.outputs.skip != 'true' && steps.tag.outputs.exists != 'true'
        shell: pwsh
        run: |
          git tag -a "v$env:VERSION" -m "Taskbar Stats v$env:VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "git tag failed."
          }
          git push origin "v$env:VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "git push failed."
          }
