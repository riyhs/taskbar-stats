name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must look like v0.1.0 (got $tag)."
          }
          $version = $tag.Substring(1)
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw "Cargo.toml version is $cargoVersion but tag is $tag."
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "EXE=TaskbarStats-$version-windows-x64.exe" >> $env:GITHUB_ENV
          "ZIP=TaskbarStats-$version-windows-x64.zip" >> $env:GITHUB_ENV
          "SHA=TaskbarStats-$version-windows-x64.zip.sha256" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release --locked

      - name: Package release
        shell: pwsh
        run: |
          $exe = "target/release/taskbar-stats.exe"
          if (!(Test-Path $exe)) {
            throw "Expected release executable at $exe"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe "dist/$env:EXE"
          Compress-Archive -Path "dist/$env:EXE" -DestinationPath "dist/$env:ZIP" -Force
          $hash = (Get-FileHash "dist/$env:ZIP" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ZIP" | Set-Content -Path "dist/$env:SHA" -Encoding ASCII
          Get-ChildItem dist | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Taskbar Stats ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.ZIP }}
            dist/${{ env.EXE }}
            dist/${{ env.SHA }}
